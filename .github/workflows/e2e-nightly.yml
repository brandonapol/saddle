name: e2e-nightly
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  e2e-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test/e2e
        env:
          E2E_RACE: "1"
