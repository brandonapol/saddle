name: Epic
description: A group of issues. The outcome, the slices, and the order.
title: "[EPIC] "
labels: ["epic"]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        An epic is a track of issues, not the work itself. Slice it into bugs, features, and chores that each state a difficulty. This issue stays open until those land.

        Standard if the breakdown is already decided. Hard if the cut between issues is still a design call.
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: How hard the breakdown, or the first slice, is.
      options:
        - hard
        - standard
        - mechanical
    validations:
      required: true
  - type: input
    id: needs
    attributes:
      label: Needs
      description: Optional capabilities the work needs beyond code, comma-separated (review, long-context, image-gen, web-research, plugin-host, hooks-required). Leave empty for none.
  - type: textarea
    id: why-difficulty
    attributes:
      label: Why this difficulty
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Every area a child issue is likely to touch.
      multiple: true
      options:
        - area:core
        - area:runner
        - area:coord
        - area:merge
        - area:planner
        - area:dispatch
        - area:tui
        - area:narrator
        - plugin
        - documentation
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this epic is done, in a few sentences. Not a list of tasks yet.
    validations:
      required: true
  - type: textarea
    id: slices
    attributes:
      label: Slices
      description: Child issues, in the order they should land. Note which are blocked on which.
      placeholder: |
        1. Store and config (#238) — blocks the rest
        2. Lease CLI
        3. Hook rewrite and PATH shims
        4. e2e journeys — depends on the three above
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Not in this epic
      description: Nearby work that looks related and is not.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The check that closes the epic. Usually "every slice has landed" plus one end-to-end proof.
    validations:
      required: true
