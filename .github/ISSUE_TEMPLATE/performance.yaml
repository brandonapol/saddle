name: Performance Issue
description: Something is slow, uses too much memory, or wakes a bigger model than it should.
title: "perf: "
labels: ["performance"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Numbers first. A feeling that it is slow is not enough to spawn a worker.

        Standard when the hot path is known and the budget is a number. Hard when the cost is a model being consulted that should have stayed quiet.
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - hard
        - standard
        - mechanical
    validations:
      required: true
  - type: input
    id: needs
    attributes:
      label: Needs
      description: Optional capabilities the work needs beyond code, comma-separated (review, long-context, image-gen, web-research, plugin-host, hooks-required). Leave empty for none.
  - type: textarea
    id: why-difficulty
    attributes:
      label: Why this difficulty
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - area:core
        - area:runner
        - area:coord
        - area:merge
        - area:planner
        - area:dispatch
        - area:tui
        - area:narrator
        - plugin
    validations:
      required: true
  - type: dropdown
    id: perf-type
    attributes:
      label: Type of issue
      multiple: true
      options:
        - Slow command
        - Hook or MCP latency
        - High CPU
        - High memory
        - Too many model tokens
        - Train or rebase time
        - TUI jank
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's slow or heavy?
      description: What you were doing, and what it cost (a stalled task, a burned plan limit, a wedged box).
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: Times, RSS, token counts, `saddle runq stats` if you have them, how many agents were running.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Saddle version
      description: Output of `saddle version`.
    validations:
      required: true
  - type: textarea
    id: claims
    attributes:
      label: Claims
      description: Path globs this ticket will change, one per line. Autopilot reserves them so disjoint tickets run in parallel. Leave empty and it infers them from the paths named above. See docs/tickets.md.
      placeholder: |
        internal/autopilot/**
        docs/tickets.md
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: The number that counts as fixed, and the test or bench that locks it.
      placeholder: |
        - Hook stays under 5ms on a light command.
        - A unit test locks the budget.
        - `make check` passes.
    validations:
      required: true
