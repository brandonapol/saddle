name: Bug Report
description: Something saddle does is wrong. Include a repro and the model that should fix it.
title: "[Bug] "
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        The orchestrator reads **Difficulty** before it spawns and picks the provider and model from it. Mechanical when the fix below is fully specified. Hard when finding the cause needs diagnosis.

        Add the matching `area:*` label if you can. If a real saddle run went wrong, also add `incident`.
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: hard when finding the cause needs diagnosis, standard for a well-scoped fix, mechanical when the fix is fully specified. The orchestrator picks the provider and model from it.
      options:
        - hard
        - standard
        - mechanical
    validations:
      required: true
  - type: input
    id: needs
    attributes:
      label: Needs
      description: Optional capabilities the work needs beyond code, comma-separated (review, long-context, image-gen, web-research, plugin-host, hooks-required). Leave empty for none.
  - type: textarea
    id: why-difficulty
    attributes:
      label: Why this difficulty
      description: One or two sentences. This is the line after "Difficulty" the orchestrator reads.
      placeholder: The repro is known and the fix is local to the tmux session-name sanitizer.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where the bug lives. Names match the area labels.
      multiple: true
      options:
        - area:core
        - area:runner
        - area:coord
        - area:merge
        - area:planner
        - area:dispatch
        - area:tui
        - area:narrator
        - plugin
        - documentation
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: Which agent runtime showed it. Pick "Not agent-specific" for train, config, or CLI bugs.
      options:
        - Claude Code
        - Grok
        - Codex
        - Plugin session (this Claude Code is the orchestrator)
        - Not agent-specific
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What saddle did, and what you expected instead. Name the task, command, or file.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, in order. A failing test is better than a narrative.
      placeholder: |
        1. Repo directory name contains a dot.
        2. saddle up
        3. Spawn a second task.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Saddle version
      description: Output of `saddle version`, plus the commit if you are on main.
      placeholder: "saddle version"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The error, the notice, or the relevant pane. Pasted as-is.
      render: shell
  - type: textarea
    id: fix
    attributes:
      label: Suspected fix
      description: Optional. File and approach, if you already know it. Say what must not change.
  - type: checkboxes
    id: flags
    attributes:
      label: Flags
      options:
        - label: Found by a real saddle run that went wrong (add the `incident` label)
        - label: Blocks the merge train or a running task
        - label: Workaround exists (describe it above)
  - type: textarea
    id: claims
    attributes:
      label: Claims
      description: Path globs this ticket will change, one per line. Autopilot reserves them so disjoint tickets run in parallel. Leave empty and it infers them from the paths named above. See docs/tickets.md.
      placeholder: |
        internal/autopilot/**
        docs/tickets.md
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How we know it is fixed. A regression test, written failing first, belongs here.
      placeholder: |
        - A config test that a repo root ending in `autobutler.org` yields a session name with no `.` or `:`.
        - `make check` passes.
    validations:
      required: true
