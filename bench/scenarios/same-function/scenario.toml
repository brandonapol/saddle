description = "Two tickets change the same function. Running them together would conflict at the train."
overlap = "critical"
safe_parallelism = 1

# Hold #1 before done until #2 has written, so the two overlap under
# symbol claims instead of #1 landing before autopilot's next tick spawns
# #2. Under file claims #2 can't start while #1 runs, so the hold lifts.
[[ticket]]
file = "01-guard-area.md"
wait_for = [2]

[[ticket.edit]]
path = "shapes/shapes.go"
old = '''
	return r.W * r.H
'''
new = '''
	if r.W < 0 || r.H < 0 {
		return 0
	}
	return r.W * r.H
'''

[[ticket]]
file = "02-round-area.md"

[[ticket.edit]]
path = "shapes/shapes.go"
old = '''
	return r.W * r.H
'''
new = '''
	return math.Round(r.W*r.H*100) / 100
'''
