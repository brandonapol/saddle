description = "Two tickets change different functions of one file. They merge cleanly; file claims still serialize them."
overlap = "low"
safe_parallelism = 2

# Hold #1 before done until #2 has written, so the two overlap under
# symbol claims instead of #1 landing before autopilot's next tick spawns
# #2. Under file claims #2 can't start while #1 runs, so the hold lifts.
[[ticket]]
file = "01-rect-perimeter.md"
wait_for = [2]

[[ticket.edit]]
path = "shapes/shapes.go"
old = '''
	return 2 * (r.W + r.H)
'''
new = '''
	if r.W < 0 || r.H < 0 {
		return 0
	}
	return 2 * (r.W + r.H)
'''

[[ticket]]
file = "02-circle-area.md"

[[ticket.edit]]
path = "shapes/shapes.go"
old = '''
	return math.Pi * c.R * c.R
'''
new = '''
	if c.R < 0 {
		return 0
	}
	return math.Pi * c.R * c.R
'''
